<style>
/* ds-allow-hardcode:start — full autònom: sense sistema de disseny extern; colors tokenitzats a :root */
:root{
  --ink:#10293a; --ink-2:#2c4556; --muted:#516776; --paper:#eef2f4; --surface:#ffffff; --line:#cfd9df; --line-2:#e3e9ec;
  --blue:#1d5aa0; --blue-bg:#e7eff9; --blue-ink:#123f73;
  --yellow:#f0c000; --yellow-bg:#fff5c7; --yellow-ink:#4a3a00;
  --green:#1b7343; --green-bg:#e3f3e9; --green-ink:#0f4d2b;
  --red:#b42318; --red-bg:#fdecea; --red-ink:#7a1710;
  --focus:#ff8a00;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-head:"Barlow Condensed", "Avenir Next Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --r-s:4px; --r-m:8px;
  --measure:72ch;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.15;margin:0;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:.5rem 1rem;z-index:99}
.skip:focus{left:8px;top:8px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- capçalera ---------- */
.top{background:var(--ink);color:#fff}
.top-in{max-width:1240px;margin:0 auto;padding:14px 16px 0;display:grid;gap:10px}
.top-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand-mark{flex:none;width:46px;height:46px}
.brand h1{font-size:1.65rem;font-weight:700}
.brand p{margin:0;color:#c3d3dc;font-size:.92rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid #6d8796;border-radius:var(--r-s);overflow:hidden}
.seg button{background:transparent;border:0;color:#fff;padding:.35rem .7rem;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.tbtn{background:transparent;border:1px solid #6d8796;color:#fff;border-radius:var(--r-s);padding:.35rem .7rem;cursor:pointer}
.tbtn:hover{border-color:#fff}
.tbtn.on{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);font-weight:700}
.daybar{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:#dbe6ec}
.daybar strong{color:#fff}
.student-chip{color:#fff;font-weight:700}
.student-chip.empty{color:#ffd48a;font-weight:400}

/* ruta de sessions */
.route{position:relative;display:flex;gap:0;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:thin}
.route button{flex:1 0 auto;min-width:118px;background:transparent;border:0;border-top:4px solid transparent;color:#c3d3dc;
  padding:.55rem .8rem .7rem;text-align:left;cursor:pointer;display:grid;gap:2px}
.route button:hover{color:#fff}
.route button[aria-selected="true"]{background:var(--paper);color:var(--ink);border-top-color:var(--yellow)}
.route .rid{font-family:var(--f-head);font-weight:700;font-size:1.25rem;line-height:1}
.route .rmeta{font-size:.78rem;display:flex;gap:6px;align-items:center}
.dotp{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid currentColor}
.dotp.part{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.dotp.full{background:currentColor}

/* ---------- disposició ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 64px}
.grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.grid > *,.top-in > *{min-width:0}
@media (max-width:900px){.grid{grid-template-columns:1fr}.toc{position:static!important;max-height:none!important}}
.toc{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.toc h2{font-size:1.05rem;margin-bottom:6px}
.toc ol{list-style:none;margin:0;padding:0}
.toc li a{display:flex;gap:6px;padding:4px 6px;border-radius:var(--r-s);text-decoration:none;color:var(--ink-2)}
.toc li a:hover{background:var(--paper)}
.toc .tk{flex:none;width:8px;margin-top:8px;height:8px;border-radius:2px;background:var(--line)}
.toc .tk.activity,.toc .tk.selfcheck{background:var(--blue)}
.toc .tk.summary{background:var(--ink)}
.toc details{margin-top:4px}
.toc summary{cursor:pointer;min-height:28px;display:list-item;padding:2px 0}
@media (max-width:900px){.toc details:not([open]) ol{display:none}}

.main{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px;margin-bottom:18px}
.panel h2{font-size:1.5rem;margin-bottom:10px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.92rem}
.field input,.field textarea,.field select{border:1px solid #9aabb6;border-radius:var(--r-s);padding:.5rem .6rem;background:#fff;width:100%}
.field textarea{min-height:5.5rem;resize:vertical}
.hint{color:var(--muted);font-size:.88rem;margin:.2rem 0 0}
.req{color:var(--red)}

/* capçalera de sessió */
.shead{display:grid;gap:10px;margin-bottom:18px}
.shead .kicker{font-family:var(--f-head);font-size:1.15rem;color:var(--muted);font-weight:600}
.shead h2{font-size:clamp(2rem,4.2vw,3rem);font-weight:700;max-width:24ch}
.metas{display:flex;flex-wrap:wrap;gap:8px}
.meta{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:.25rem .55rem;font-size:.86rem}
.meta b{font-weight:700}
.meta.warn{border-color:var(--yellow);background:var(--yellow-bg);color:var(--yellow-ink)}

/* seccions de contingut */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:14px;padding:18px 22px;scroll-margin-top:12px}
.sec > h3{font-size:1.45rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}
.sec > h3 .n{color:var(--muted);font-weight:600;min-width:1.6em}
.kindtag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-body);font-size:.78rem;font-weight:700;padding:.1rem .45rem;border-radius:var(--r-s);
  background:var(--paper);color:var(--ink-2);vertical-align:middle;margin-left:auto;white-space:nowrap}
.kindtag svg{width:14px;height:14px}
.sec.k-example{border-left:6px solid #6b8aa0}
.sec.k-objectives{border-left:6px solid var(--ink)}
.sec.k-summary{background:#f6f9fb;border-left:6px solid var(--ink)}
.sec.k-activity,.sec.k-selfcheck{border-left:6px solid var(--blue)}
.prose{max-width:none}
.prose > p,.prose > h4,.prose > ul:not(.bal),.prose > ol:not(.bal):not(.arrows),.prose > .flow,.prose > .box,.prose > .tablewrap{max-width:var(--measure)}
.prose p{margin:.45rem 0}
.prose h4{font-size:1.2rem;margin:1rem 0 .3rem;color:var(--ink-2)}
.prose ul,.prose ol{margin:.35rem 0 .6rem;padding-left:1.4rem}
.prose li{margin:.15rem 0}
.prose li::marker{color:var(--muted)}
.prose .l2{padding-left:2.6rem}
.prose .l0{padding-left:1.6rem}
.tablewrap{overflow-x:auto;margin:.7rem 0;border:1px solid var(--line);border-radius:var(--r-s)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:.45rem .6rem;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
thead th{background:var(--ink);color:#fff;font-weight:700}
tbody tr:nth-child(even) td{background:#f7f9fa}
.flow{display:grid;justify-items:start;gap:0;margin:.8rem 0;padding:.2rem 0}
.flow .st{border:2px solid var(--ink);border-radius:var(--r-s);padding:.3rem .7rem;font-weight:700;background:#fff;max-width:var(--measure)}
.flow .ar{width:2px;height:14px;background:var(--ink);margin-left:22px;position:relative}
.flow .ar::after{content:"";position:absolute;bottom:-5px;left:-4px;border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
.flow .tx{padding:.15rem 0 .15rem .3rem;color:var(--ink-2)}
details.assess{margin-top:.4rem}
details.assess > summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
.srcnote{font-size:.82rem;color:var(--muted);margin-top:.6rem}

/* vídeos */
.video{display:grid;grid-template-columns:auto 1fr;gap:12px;border:1px dashed #8aa0ad;border-radius:var(--r-m);padding:12px 14px;margin:12px 0;background:#f8fafb}
.video .vi{width:40px;height:40px;border-radius:var(--r-s);background:var(--ink);color:#fff;display:grid;place-items:center}
.video h4{font-size:1.15rem;margin-bottom:2px}
.video .vm{font-size:.86rem;color:var(--muted)}
.video .ver{font-weight:700;font-size:.8rem;padding:.05rem .35rem;border-radius:var(--r-s)}
.video .ver.ok{background:var(--green-bg);color:var(--green-ink)}
.video .ver.no{background:var(--yellow-bg);color:var(--yellow-ink)}

/* ---------- activitats ---------- */
.act{border:2px solid var(--line);border-radius:var(--r-m);margin:14px 0;background:#fff;overflow:hidden}
.act-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.act-h h4{font-size:1.25rem;flex:1 1 260px}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.8rem;padding:.2rem .5rem;border-radius:var(--r-s);white-space:nowrap}
.badge svg{width:16px;height:16px;flex:none}
.act.t-auto{border-color:var(--blue)} .act.t-auto .act-h{background:var(--blue-bg)} .b-auto{background:var(--blue);color:#fff}
.act.t-teacher{border-color:var(--yellow)} .act.t-teacher .act-h{background:var(--yellow-bg)} .b-teacher{background:var(--yellow);color:#231b00}
.act.t-class{border-color:var(--green)} .act.t-class .act-h{background:var(--green-bg)} .b-class{background:var(--green);color:#fff}
.b-origin{background:#fff;border:1px solid var(--line);color:var(--ink-2);font-weight:400}
.act-b{padding:12px 14px}
.act-meta{font-size:.84rem;color:var(--muted);margin:0 0 8px}
.instr{margin:0 0 10px;max-width:var(--measure)}
.q{border-top:1px solid var(--line-2);padding:10px 0}
.q:first-of-type{border-top:0}
.q legend,.q .ql{font-weight:700;padding:0;margin-bottom:6px;max-width:var(--measure)}
fieldset.q{border:0;margin:0;min-width:0;border-top:1px solid var(--line-2)}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:var(--r-s);cursor:pointer;max-width:var(--measure)}
.opt:hover{background:var(--paper)}
.opt input{margin-top:.35rem;width:18px;height:18px;flex:none}
.opt.is-right{background:var(--green-bg)}
.opt.is-wrong{background:var(--red-bg)}
.fb{margin-top:6px;padding:6px 10px;border-radius:var(--r-s);font-size:.95rem;display:flex;gap:8px;align-items:flex-start}
.fb svg{width:18px;height:18px;flex:none;margin-top:3px}
.fb.ok{background:var(--green-bg);color:var(--green-ink)}
.fb.ko{background:var(--red-bg);color:var(--red-ink)}
.row-sel{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,280px) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2)}
@media (max-width:620px){.row-sel{grid-template-columns:1fr}}
.row-sel select{border:1px solid #9aabb6;border-radius:var(--r-s);padding:.4rem;background:#fff;width:100%}
.mark{font-weight:700;font-size:.85rem;display:inline-flex;gap:4px;align-items:center}
.mark.ok{color:var(--green)} .mark.ko{color:var(--red)}
.mark svg{width:16px;height:16px}
.order li{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-s);margin:6px 0;background:#fff}
.order{list-style:none;padding:0;margin:0;counter-reset:o}
.order li::before{counter-increment:o;content:counter(o);font-family:var(--f-head);font-weight:700;font-size:1.2rem;min-width:1.4em;color:var(--muted)}
.order .ot{flex:1}
.order button{border:1px solid #9aabb6;background:#fff;border-radius:var(--r-s);width:34px;height:34px;cursor:pointer}
.order button:disabled{opacity:.35;cursor:default}
.order li.ok{border-color:var(--green);background:var(--green-bg)}
.order li.ko{border-color:var(--red);background:var(--red-bg)}
.act-f{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:#fafbfc}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r-s);padding:.45rem .9rem;font-weight:700;cursor:pointer}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.ghost:hover{background:var(--paper)}
.btn.big{font-size:1.05rem;padding:.6rem 1.1rem}
.btn.warn{background:#fff;border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.score{font-weight:700}
.scorebox{font-size:.92rem;color:var(--ink-2)}
.how{font-size:.82rem;color:var(--muted);width:100%}
.gridin{width:100%;border-collapse:collapse}
.gridin td,.gridin th{border:1px solid var(--line);padding:4px}
.gridin textarea{width:100%;min-height:3.2rem;border:0;resize:vertical;padding:4px}
.status{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:.86rem;padding:.15rem .5rem;border-radius:var(--r-s);border:1px solid var(--line)}
.status.pend{background:#fff}
.status.lliu{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-ink)}
.status.rev{background:var(--green-bg);border-color:var(--green);color:var(--green-ink)}
.tbox{margin-top:12px;border:2px dashed var(--yellow);border-radius:var(--r-m);padding:10px 12px;background:#fffcf0}
.tbox h5{margin:0 0 6px;font-family:var(--f-head);font-size:1.1rem}
.tbox .ro{color:var(--muted);font-style:italic}
.tbox .form-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.chk{display:flex;gap:8px;align-items:center;font-weight:700}
.chk input{width:20px;height:20px}

.nav-s{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
.final-h{font-size:1.6rem;margin:26px 0 8px}

/* banda del docent */
.tband{background:var(--yellow);color:#231b00;font-weight:700;text-align:center;padding:6px 12px;font-size:.92rem}

/* progrés */
.prog-table td,.prog-table th{white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--line-2);overflow:hidden;min-width:90px}
.bar > i{display:block;height:100%;background:var(--blue)}

/* informe */
.overlay{position:fixed;inset:0;background:rgba(10,25,35,.55);z-index:50;display:none;overflow:auto;padding:24px 12px}
.overlay.open{display:block}
.sheet{max-width:900px;margin:0 auto;background:#fff;border-radius:var(--r-m);padding:22px 26px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet-top{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet h2{font-size:1.9rem}
.rep h3{font-size:1.35rem;margin:18px 0 6px;border-bottom:2px solid var(--ink);padding-bottom:3px}
.rep h4{font-size:1.1rem;margin:12px 0 4px}
.rep table{font-size:.88rem}
.rep .src-a{color:var(--blue-ink);font-weight:700}
.rep .src-t{color:#6b5300;font-weight:700}
.rep .ans{white-space:pre-wrap;background:#f6f8f9;border-left:3px solid var(--line);padding:4px 8px;margin:4px 0;font-size:.88rem}
.legend{font-size:.86rem;border:1px solid var(--line);padding:6px 10px;border-radius:var(--r-s);background:#f8fafb}
#copyfallback{width:100%;min-height:240px;font:400 .85rem/1.4 ui-monospace,Menlo,monospace;margin-top:10px;display:none}

#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:var(--r-s);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:92vw}
#toast.show{opacity:1}
.foot{max-width:1240px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.86rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

@media print{
  body{background:#fff;font-size:10.5pt}
  body.print-report .top,body.print-report .wrap,body.print-report .foot,body.print-report .tband,body.print-report .sheet-top,body.print-report #toast{display:none!important}
  body.print-report .overlay{position:static;display:block;background:none;padding:0}
  body.print-report .sheet{box-shadow:none;padding:0;max-width:none}
  .rep h3{break-after:avoid}
  .rep tr{break-inside:avoid}
  a{color:inherit;text-decoration:none}
}

/* ---------- portada de bloc (placa de senyalització) ---------- */
.cover{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 26px;background:var(--ink);color:#fff;border-radius:var(--r-m);
  padding:22px 24px 34px;overflow:hidden}
.cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;
  background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,var(--ink) 14px 28px)}
.cv-id{display:grid;align-content:start;gap:2px}
.cv-code{font-family:var(--f-head);font-weight:700;font-size:clamp(3.4rem,8vw,5.6rem);line-height:.86;color:var(--yellow);letter-spacing:-.01em}
.cv-sub{font-size:.84rem;color:#c3d3dc;white-space:nowrap}
.cv-main{min-width:0;display:grid;gap:10px;align-content:start}
.cover h2{font-size:clamp(1.7rem,3.6vw,2.6rem);font-weight:700;max-width:28ch;color:#fff}
.cv-lead{margin:0;color:#dbe6ec;max-width:60ch}
.cv-signs{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px 18px}
.cv-signs li{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;color:#fff;max-width:15rem;line-height:1.25}
.cv-signs .sign{width:46px;height:46px}
.cv-art{width:170px;align-self:end;margin:-6px 0 -22px;line-height:0}
.cv-art svg{width:100%;height:auto}
.anim .cover:not(.in) .cv-art{opacity:0}
.anim .cover.in .cv-art{animation:rise .7s cubic-bezier(.2,.7,.2,1) both .1s}
@media (max-width:980px){.cv-art{width:130px}}
@media (max-width:760px){.cv-art{display:none}}
@media (max-width:620px){.cover{grid-template-columns:1fr;padding:18px 16px 30px}.cv-sub{white-space:normal}}
.pres-btn{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.pres-btn svg{width:16px;height:16px}

/* senyals */
.sign{display:inline-block;flex:none;width:44px;height:44px;line-height:0}
.sign svg{width:100%;height:100%;overflow:visible}

/* ---------- infografies ---------- */
.viz{margin:14px 0 16px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-m);background:#f7fafb}
.viz-t{font-size:1.15rem;margin:0 0 10px;color:var(--ink)}
.viz figcaption{font-size:.84rem;color:var(--muted);margin-top:8px}
.ct{display:grid;gap:2px;min-width:0}
.ct strong{font-family:var(--f-head);font-size:1.12rem;line-height:1.15;font-weight:700}
.ct span{font-size:.92rem;color:var(--ink-2);line-height:1.4}
.num{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--f-head);font-weight:700;font-size:1.2rem}

/* cadena de procés */
.chain{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0}
.chain li{position:relative;display:grid;justify-items:center;text-align:center;gap:8px;padding:4px 14px}
.chain li + li::before{content:"";position:absolute;left:-9px;top:20px;width:18px;height:3px;background:var(--ink)}
.chain li + li::after{content:"";position:absolute;left:5px;top:15px;border:6.5px solid transparent;border-left:8px solid var(--ink)}
.chain .ct{justify-items:center}
@media (max-width:760px){
  .chain{grid-auto-flow:row}
  .chain li{grid-template-columns:auto 1fr;justify-items:start;text-align:left;padding:8px 0 8px 0}
  .chain .ct{justify-items:start}
  .chain li + li::before{left:21px;top:-6px;width:3px;height:12px}
  .chain li + li::after{left:16px;top:2px;border:6.5px solid transparent;border-top:8px solid var(--ink);border-bottom:0}
}
/* passos verticals */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:8px 0;position:relative}
.steps li + li::before{content:"";position:absolute;left:20px;top:-10px;height:18px;width:3px;background:var(--line)}

/* targetes */
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.cards.c2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cards.c4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card .cn{position:absolute;top:4px;right:8px;font-family:var(--f-head);font-weight:700;font-size:1.05rem;color:var(--muted)}
.card{position:relative;display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-top:5px solid var(--ink);border-radius:var(--r-s);padding:10px 12px}
.card.s-ghs{border-top-color:var(--red)} .card.s-warn{border-top-color:var(--yellow)} .card.s-must{border-top-color:var(--blue)} .card.s-ban,.card.s-fire{border-top-color:var(--red)} .card.s-safe{border-top-color:var(--green)}

/* comparació */
.compare{display:grid;gap:10px;align-items:stretch}
.compare.n2{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.compare.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.compare.n4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.compare.n5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.compare.n2:not(:has(.vs)){grid-template-columns:repeat(2,minmax(0,1fr))}
.compare .col{background:#fff;border:1px solid var(--line);border-radius:var(--r-s);padding:12px;border-left:6px solid var(--ink)}
.compare .col.s-warn{border-left-color:var(--yellow)} .compare .col.s-must{border-left-color:var(--blue)} .compare .col.s-ban,.compare .col.s-fire{border-left-color:var(--red)} .compare .col.s-safe{border-left-color:var(--green)}
.col-h{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.col-h strong{font-family:var(--f-head);font-size:1.25rem;line-height:1.1}
.col p{margin:.2rem 0 .4rem;font-size:.95rem}
.col ul{margin:0;padding-left:1.1rem;font-size:.95rem}
.vs{align-self:center;font-family:var(--f-head);font-weight:700;font-size:1.3rem;color:var(--muted)}
@media (max-width:760px){.compare.n2,.compare.n3,.compare.n2:not(:has(.vs)){grid-template-columns:1fr}.vs{justify-self:center}}

/* piràmide (jerarquia) */
.pyr ol{list-style:none;margin:0 auto;padding:0;display:grid;gap:5px;justify-items:center}
.pyr li{width:var(--w);min-width:min(100%,250px)}
.pyr .lvl{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;padding:9px 14px;color:#fff;
  background:color-mix(in srgb,var(--green) calc(100% - var(--k) * 18%),var(--ink));clip-path:polygon(0 0,100% 0,97% 100%,3% 100%)}
.pyr .lvl strong{font-family:var(--f-head);font-size:1.15rem}
.pyr .lvl span{font-size:.88rem;opacity:.95}
.pyr .pi{width:22px;height:22px;display:inline-block}
.pyr .pi svg{width:100%;height:100%}
.axis{display:flex;justify-content:space-between;font-size:.84rem;color:var(--muted);margin:8px 0 0;font-weight:700}
.axis span:first-child::before{content:"▲ "}
.axis span:last-child::after{content:" ▼"}

/* cicle */
.cycle{list-style:none;margin:0 auto;padding:0;position:relative;width:min(100%,460px);aspect-ratio:1}
.cycle.n3{width:min(100%,400px)}
.cycle::before{content:"";position:absolute;inset:12%;border:3px dashed var(--line);border-radius:50%}
.cycle li{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:34%;display:grid;justify-items:center;text-align:center;gap:4px;
  background:#f7fafb;padding:4px}
.cycle li strong{font-family:var(--f-head);font-size:1.08rem;line-height:1.1}
.cycle li span{font-size:.84rem;line-height:1.3;color:var(--ink-2)}
.cycle .hub{left:50%;top:50%;width:30%;background:var(--ink);color:#fff;border-radius:50%;aspect-ratio:1;place-content:center;font-family:var(--f-head);font-weight:700;font-size:1.1rem;padding:8px}
@media (max-width:620px){
  .cycle{aspect-ratio:auto;display:grid;gap:8px}
  .cycle::before,.cycle .hub{display:none}
  .cycle li{position:static;transform:none;width:auto;grid-template-columns:auto 1fr;justify-items:start;text-align:left;align-items:center}
  .cycle li span{grid-column:2}
}

/* xifra o definició clau */
.keyf{display:flex;gap:14px;align-items:flex-start}
.keyf .sign{width:56px;height:56px}
.keyf .big{font-family:var(--f-head);font-weight:700;font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1;margin:0 0 6px}
.keyf blockquote{margin:0;font-size:1.05rem;border-left:4px solid var(--ink);padding:2px 0 2px 12px;max-width:var(--measure)}
.keyf.s-warn blockquote{border-left-color:var(--yellow)} .keyf.s-must blockquote{border-left-color:var(--blue)} .keyf.s-ban blockquote,.keyf.s-fire blockquote{border-left-color:var(--red)} .keyf.s-safe blockquote{border-left-color:var(--green)}
.keyf .src{font-size:.84rem;color:var(--muted);margin:6px 0 0}

/* barres */
.bars{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bars li{display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:10px;align-items:center}
.bl{font-weight:700;font-size:.93rem}
.bt{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.bt i{flex:none}
.bt i{display:block;height:22px;width:calc(var(--v) * .62);border-radius:0 var(--r-s) var(--r-s) 0;background:var(--ink)}
.bt i.s-warn{background:var(--yellow)} .bt i.s-must{background:var(--blue)} .bt i.s-ban,.bt i.s-fire{background:var(--red)} .bt i.s-safe{background:var(--green)}
.bt b{font-size:.9rem;min-width:0;line-height:1.25}
@media (max-width:620px){.bars li{grid-template-columns:1fr}}

/* matriu */
.mtx th[scope=row]{background:#f2f5f7}
.mtx td{text-align:center;font-weight:700}
.mtx .lv1{background:#dff1e5!important;color:var(--green-ink)}
.mtx .lv2{background:#eef7d9!important;color:#3d5110}
.mtx .lv3{background:var(--yellow-bg)!important;color:var(--yellow-ink)}
.mtx .lv4{background:#ffe1c2!important;color:#6b3300}
.mtx .lv5{background:#f9d0cc!important;color:var(--red-ink)}

/* termes del manual */
.terms{list-style:none;margin:.6rem 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;max-width:none}
.terms li{margin:0;background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:var(--r-s);padding:8px 12px;display:grid;gap:2px}
.terms strong{font-family:var(--f-head);font-size:1.12rem;line-height:1.15}
.terms span{font-size:.95rem}

details.fulltext{margin-top:6px;border:1px solid var(--line);border-radius:var(--r-s);background:#fff}
details.fulltext > summary{cursor:pointer;font-weight:700;color:var(--ink-2);padding:8px 12px;display:flex;gap:8px;align-items:center}
details.fulltext > summary svg{width:18px;height:18px;flex:none}
details.fulltext[open] > summary{border-bottom:1px solid var(--line-2)}
details.fulltext > .prose{padding:4px 14px 8px}
/* frases «A → B → C» del manual */
.prose ol.arrows,ol.arrows{list-style:none;margin:.7rem 0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 0}
ol.arrows li{margin:0;background:var(--ink);color:#fff;font-weight:700;font-size:.95rem;padding:.35rem .7rem;border-radius:var(--r-s);position:relative}
ol.arrows li + li{margin-left:22px}
ol.arrows li + li::before{content:"";position:absolute;left:-17px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:9px solid var(--ink)}
.anim ol.arrows:not(.in) li{opacity:0}
.anim ol.arrows.in li{animation:rise .45s ease-out both;animation-delay:calc(var(--d,0) * 110ms)}
/* procés del manual (diagrames ↓) */
.flow .st{position:relative}

/* ---------- animació d'entrada (un sol cop) ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
.anim .viz:not(.in) li,.anim .viz:not(.in) .col,.anim .viz:not(.in) .keyf,.anim .viz:not(.in) td,
.anim .flow:not(.in) > *,.anim .terms:not(.in) li,.anim .cover:not(.in) .cv-signs li{opacity:0}
.anim .viz.in li,.anim .viz.in .col,.anim .viz.in .keyf,.anim .terms.in li{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 110ms)}
.anim .viz.in td{animation:rise .4s ease-out both;animation-delay:calc(var(--d,0) * 60ms)}
.anim .viz.in .sign{animation:pop .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 110ms + 80ms)}
.anim .viz.in .bt i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 120ms + 150ms)}
.anim .flow.in > *{animation:rise .45s ease-out both}
.anim .flow.in > :nth-child(2){animation-delay:.12s} .anim .flow.in > :nth-child(3){animation-delay:.24s} .anim .flow.in > :nth-child(4){animation-delay:.36s}
.anim .flow.in > :nth-child(5){animation-delay:.48s} .anim .flow.in > :nth-child(6){animation-delay:.6s} .anim .flow.in > :nth-child(7){animation-delay:.72s}
.anim .flow.in > :nth-child(n+8){animation-delay:.84s}
.anim .cover.in .cv-signs li{animation:pop .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 140ms + 150ms)}


/* ---------- mode presentació ---------- */
body.pres-on{overflow:hidden}
.pres{position:fixed;inset:0;z-index:70;background:var(--paper);display:grid;grid-template-rows:auto auto 1fr auto}
.pres-top{display:flex;gap:12px;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:10px 18px}
.pres-top strong{font-family:var(--f-head);font-size:1.2rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pres-prog{height:5px;background:var(--line-2)} .pres-prog i{display:block;height:100%;background:var(--yellow);transition:width .3s}
.stage{overflow:auto;padding:28px clamp(16px,5vw,64px) 40px;outline:none}
.stage > *{max-width:1080px;margin:0 auto}
.stage .cover{min-height:60vh;align-content:center}
.stage .cover h2{font-size:clamp(2.2rem,5vw,3.6rem)}
.slide-in > h3{font-size:clamp(1.8rem,3.6vw,2.6rem);display:flex;gap:12px;margin-bottom:14px}
.slide-in > h3 .n{color:var(--muted)}
.slide-in .prose{font-size:1.2rem;max-width:none}
.slide-in .prose > p,.slide-in .prose > ul:not(.bal),.slide-in .prose > ol:not(.bal):not(.arrows){max-width:70ch}
.slide-in .viz{background:#fff;padding:18px 20px}
.slide-in .sign{width:62px;height:62px}
.slide-in .ct strong,.slide-in .col-h strong,.slide-in .cycle li strong,.slide-in .terms strong{font-size:1.45rem}
.slide-in .ct span,.slide-in .col ul,.slide-in .col p,.slide-in .terms span,.slide-in .cycle li span{font-size:1.08rem}
.slide-in .viz-t{font-size:1.4rem}
.slide-in .chain li + li::before{top:29px}.slide-in .chain li + li::after{top:24px}
.pres-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;background:#fff;border-top:1px solid var(--line)}
.count{font-family:var(--f-head);font-weight:700;font-size:1.2rem}
.pres:fullscreen{background:var(--paper)}

@media print{
  .anim .viz li,.anim .viz .col,.anim .flow > *,.anim .terms li,.anim .cover .cv-signs li,.anim td,.anim ol.arrows li{opacity:1!important;animation:none!important}
  .pres-btn{display:none}
}

/* ---------- «SmartArt» automàtic sobre el text del manual ---------- */
.prose h4.sub{font-size:1.12rem;margin:1.1rem 0 .35rem;padding-left:10px;border-left:4px solid var(--yellow);color:var(--ink);letter-spacing:.02em}
.box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;margin:.8rem 0;padding:12px 14px;border-radius:var(--r-m);border:1px solid var(--line);background:#f7fafb;max-width:var(--measure)}
.box-i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff}
.box-i svg{width:20px;height:20px}
.box-av{width:46px;height:46px;line-height:0}.box-av svg{width:100%;height:100%}
.box-h{margin:0 0 .2rem!important;font-family:var(--f-head);font-weight:700;font-size:1.08rem;letter-spacing:.02em}
.box-b > :first-child{margin-top:0}.box-b > :last-child{margin-bottom:0}
.box.b-example{border-left:6px solid #6b8aa0;background:#f3f6f8}.box.b-example .box-i{background:#6b8aa0}
.box.b-important{border-left:6px solid var(--red);background:var(--red-bg)}.box.b-important .box-i{background:var(--red)}
.box.b-idea{border-left:6px solid var(--yellow);background:var(--yellow-bg)}
.box.b-idea .box-b{position:relative;background:#fff;border-radius:var(--r-m);padding:8px 12px;border:1px solid #ecd98a}
.box.b-idea .box-b::before{content:"";position:absolute;left:-9px;top:12px;border:8px solid transparent;border-right-color:#ecd98a;border-left:0}
.box.b-analogy{border-left:6px solid var(--blue);background:var(--blue-bg)}.box.b-analogy .box-i{background:var(--blue)}
.box.b-measures{border-left:6px solid var(--green);background:var(--green-bg)}.box.b-measures .box-i{background:var(--green)}
.box.inline{align-items:center}
ul.chips{list-style:none;padding:0!important;margin:.5rem 0 .8rem;display:flex;flex-wrap:wrap;gap:6px}
ul.chips li{margin:0;background:#fff;border:1px solid var(--line);border-radius:999px;padding:.25rem .75rem .25rem .6rem;font-size:.95rem;display:inline-flex;gap:6px;align-items:center}
ul.chips li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yellow);border:1.5px solid var(--ink);flex:none}
ol.auto-steps{list-style:none;padding:0!important;margin:.6rem 0 .9rem;display:grid;gap:0;counter-reset:none}
ol.auto-steps li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin:0;padding:6px 0;position:relative}
ol.auto-steps li + li::before{content:"";position:absolute;left:14px;top:-8px;height:14px;width:3px;background:var(--line)}
.as-n{width:31px;height:31px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--f-head);font-weight:700}
ol.smart-goals,ul.smart-can{list-style:none;padding:0!important;margin:.6rem 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;max-width:none}
ol.smart-goals li,ul.smart-can li{margin:0;display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;font-size:.96rem;line-height:1.4}
.sm-i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff}
.sm-i svg{width:18px;height:18px}
ul.smart-can .sm-i{background:var(--green);border-radius:6px}
.anim .chips:not(.in) li,.anim .auto-steps:not(.in) li,.anim .smart-goals:not(.in) li,.anim .smart-can:not(.in) li,.anim .box:not(.in){opacity:0}
.anim .chips.in li,.anim .auto-steps.in li,.anim .smart-goals.in li,.anim .smart-can.in li{animation:rise .45s ease-out both;animation-delay:calc(var(--d,0) * 70ms)}
.anim .box.in{animation:rise .5s ease-out both}
@media print{.anim .chips li,.anim .auto-steps li,.anim .smart-goals li,.anim .smart-can li,.anim .box{opacity:1!important;animation:none!important}}

/* ---------- escenes de treball ---------- */
.v-scene{background:#fff}
.scene{position:relative;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line);max-width:760px}
.scene-art{display:block;line-height:0}.scene-art svg{width:100%;height:auto}
.spot{position:absolute;transform:translate(-15%,-110%);width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:var(--red);color:#fff;
  font-family:var(--f-head);font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 0 0 0 rgba(180,35,24,.55);animation:pulse 2s infinite}
.spot.on{background:var(--ink);animation:none}
.spot:hover{background:#8f1c13}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,35,24,.55)}70%{box-shadow:0 0 0 12px rgba(180,35,24,0)}100%{box-shadow:0 0 0 0 rgba(180,35,24,0)}}
.spot-hint{margin:0 0 8px!important}
.spot-list{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px;max-width:760px}
.spot-list li{display:flex;gap:10px;align-items:baseline;background:#f7fafb;border:1px solid var(--line);border-radius:var(--r-s);padding:6px 10px}
.spot-list li b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--f-head)}
.spot-list li.hidden{color:var(--muted);font-style:italic}
@media (max-width:620px){.spot{width:26px;height:26px;font-size:.9rem}}
@media print{.spot{animation:none}}

/* ---------- correccions de maquetació (revisió del docent) ---------- */
.flow .fl-intro{margin:0 0 .5rem;font-weight:400;color:var(--ink-2)}
.flow .st + .st{margin-top:8px}
.cards .card{flex-direction:column;gap:8px}
.ct strong,.col-h strong,.terms strong{overflow-wrap:break-word}
.ct,.card{min-width:0}
ol.smart-goals.sub{margin:-2px 0 6px 36px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
ol.smart-goals.sub li{background:var(--yellow-bg);border-color:#ecd98a;padding:6px 10px}
ol.smart-goals.sub .sm-i{background:var(--yellow);color:var(--ink);width:22px;height:22px}
ol.smart-goals.sub .sm-i svg{width:14px;height:14px}
.prose ol.arrows,ol.arrows{flex-wrap:nowrap;align-items:stretch}
ol.arrows li{flex:1 1 auto;min-width:auto;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;font-size:.88rem;padding:.35rem .55rem;overflow-wrap:normal;hyphens:manual;-webkit-hyphens:manual}
@media (max-width:620px){.prose ol.arrows,ol.arrows{flex-direction:column;align-items:stretch}ol.arrows li + li{margin:18px 0 0}
  ol.arrows li + li::before{left:50%;top:-15px;margin:0 0 0 -6px;border:6px solid transparent;border-top:9px solid var(--ink);border-bottom:0}}
.cycle{margin:34px auto 64px}
.cycle li{width:30%}
.cycle.n3 li,.cycle.n4 li{width:36%}
.tri{position:relative;max-width:440px;height:280px;margin:10px auto 4px}
.tri-art{position:absolute;inset:44px 30px 52px;line-height:0}.tri-art svg{width:100%;height:100%}
.tri-v{position:absolute;display:grid;justify-items:center;gap:4px;text-align:center;width:44%}
.tri-v strong{font-family:var(--f-head);font-size:1.08rem;line-height:1.15}
.tri-v .sign{width:42px;height:42px}
.tri-v.t{left:28%;top:0}
.tri-v.l{left:0;bottom:0}
.tri-v.r{right:0;bottom:0}
.tri-c{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;font-family:var(--f-head);font-weight:700;padding:.35rem .7rem;border-radius:var(--r-s);text-align:center;max-width:42%;line-height:1.15}
.box .tri{margin:12px auto 6px}
.anim .viz:not(.in) .tri-v,.anim .viz:not(.in) .tri-c{opacity:0}
.anim .viz.in .tri-v,.anim .viz.in .tri-c{animation:rise .5s ease-out both}
.anim .viz.in .tri-v.l{animation-delay:.15s}.anim .viz.in .tri-v.r{animation-delay:.3s}.anim .viz.in .tri-c{animation-delay:.45s}
.prose ol.arrows.many,ol.arrows.many{flex-wrap:wrap;align-items:center;gap:8px 0}
ol.arrows.many li{flex:0 1 auto}
.tri-v strong{max-width:100%;overflow-wrap:break-word}
@media (max-width:620px){
  .cycle li,.cycle.n3 li,.cycle.n4 li{width:auto}

  .tri-c{position:static;transform:none;max-width:none;justify-self:start}
}
/* files equilibrades (--cols calculat a partir del nombre d'elements) */
.bal{display:grid!important;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:10px}
ul.chips.bal{gap:6px!important}
ul.chips.bal li{justify-content:flex-start;border-radius:var(--r-m);line-height:1.25}
ul.chips.bal li,.card .ct strong{overflow-wrap:break-word;word-break:normal}
/* mode presentació: tarjetes amb lletra proporcionada */
.slide-in .card .ct strong{font-size:1.18rem}
.slide-in .card .sign{width:50px;height:50px}
.slide-in ul.chips li{font-size:1.02rem}
.cycle.n5 li,.cycle.n6 li{width:27%}
.cycle.n5,.cycle.n6{width:min(100%,520px)}
@media (max-width:620px){.cycle.n5 li,.cycle.n6 li{width:auto}}
.col-h{flex-wrap:wrap}
.compare.n4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

.slide-in .compare.n4 .col-h strong,.slide-in .compare.n5 .col-h strong{font-size:1.2rem}

/* ---------- tema «digital» (meta.theme = "digital"): competència digital, sense estètica de seguretat industrial ---------- */
:root[data-theme="digital"]{
  --ink:#14353d; --ink-2:#2d4b52; --muted:#4c666c; --paper:#edf3f2; --line:#c8d8d6; --line-2:#dfe9e7;
  --blue:#1d5c88; --blue-bg:#e4eef6; --blue-ink:#143f5d;
  --yellow:#f3b33d; --yellow-bg:#fff0d0; --yellow-ink:#4a3000;
  --teal:#5cc2b5;
}
:root[data-theme="digital"] .cover::after{height:10px;
  background:repeating-linear-gradient(90deg,var(--yellow) 0 18px,transparent 18px 24px,var(--teal) 24px 34px,transparent 34px 40px,#ffffff 40px 46px,transparent 46px 52px)}
/* ---------- tema «social» (meta.theme = "social"): blaus suaus, volum 3D, cantonades arrodonides i ombres difuses ---------- */
:root[data-theme="social"]{
  --ink:#0f2a5c; --ink-2:#28427a; --muted:#4a5f8c; --paper:#eef2f8; --surface:#ffffff; --line:#cfdcf5; --line-2:#e1e9fa;
  --blue:#2160e0; --blue-bg:#e5eeff; --blue-ink:#163b8f;
  --yellow:#8ab8ff; --yellow-bg:#e4eeff; --yellow-ink:#11367f;
  --teal:#bcd6ff; --r-s:10px; --r-m:16px;
  --sh-1:0 1px 2px rgba(16,24,40,.05),0 4px 12px -6px rgba(16,24,40,.10);
  --sh-2:0 2px 4px rgba(16,24,40,.06),0 16px 32px -20px rgba(16,24,40,.28);
}
:root[data-theme="social"] body{background:var(--paper)}
:root[data-theme="social"] h1,:root[data-theme="social"] h2,:root[data-theme="social"] h3,:root[data-theme="social"] h4{font-weight:600}
:root[data-theme="social"] .top{background:linear-gradient(120deg,#1747c4 0%,#2563eb 48%,#4f8df5 100%);box-shadow:none}
:root[data-theme="social"] .brand p,:root[data-theme="social"] .route button{color:#dbe7ff}
:root[data-theme="social"] .daybar{color:#e6eeff}
:root[data-theme="social"] .seg,:root[data-theme="social"] .tbtn{border-color:#a9c6ff;border-radius:var(--r-s)}
:root[data-theme="social"] .seg button{border-radius:0}
:root[data-theme="social"] .tbtn.on{background:#fff;color:var(--blue-ink);border-color:#fff}
:root[data-theme="social"] .route button{border-radius:14px 14px 0 0}
:root[data-theme="social"] .route button[aria-selected="true"]{background:var(--paper);color:var(--ink);border-top-color:#8ab8ff}
:root[data-theme="social"] .cover{background:linear-gradient(135deg,#1a4cc9 0%,#2563eb 62%,#4f86ee 100%);border-radius:20px;box-shadow:var(--sh-2);padding-bottom:26px}

:root[data-theme="social"] .cover::after{height:6px;background:linear-gradient(90deg,rgba(255,255,255,.65),rgba(255,255,255,.15))}
:root[data-theme="social"] .cv-code{color:#fff;font-weight:600}
:root[data-theme="social"] .cv-sub,:root[data-theme="social"] .cv-lead{color:#eaf2ff}
:root[data-theme="social"] .cv-art{width:190px;margin-bottom:-14px}
@media (max-width:980px){:root[data-theme="social"] .cv-art{width:150px}}
@media (max-width:760px){:root[data-theme="social"] .cv-art{display:none}}
:root[data-theme="social"] .sec,:root[data-theme="social"] .panel,:root[data-theme="social"] .toc,:root[data-theme="social"] details.id-mini{border-color:var(--line-2);box-shadow:var(--sh-1)}
:root[data-theme="social"] .act{border-color:var(--line);box-shadow:var(--sh-1);background:#fff}
:root[data-theme="social"] .viz{border-color:var(--line-2);background:#f8fafe}
:root[data-theme="social"] .meta{border-radius:var(--r-s)}
:root[data-theme="social"] ul.act-facts li{border-radius:8px}
:root[data-theme="social"] ul.links a{border-left-color:#4f8df5;box-shadow:var(--sh-1)}
:root[data-theme="social"] .btn{border-radius:999px}
:root[data-theme="social"] .btn.rep-s{background:var(--blue);border-color:var(--blue);color:#fff}
/* ---------- glossari (node "defs") ---------- */
dl.defs{margin:.6rem 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
dl.defs > div{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 16px;background:var(--surface)}
dl.defs dt{font-weight:700;color:var(--blue-ink);margin:0 0 4px}
dl.defs dd{margin:0;color:var(--ink-2);font-size:.97rem;line-height:1.5}
/* ---------- fitxa d'activitat ---------- */
ul.act-facts{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
ul.act-facts li{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-s);padding:.15rem .55rem;font-size:.86rem}
ul.act-facts li.time{background:var(--yellow-bg);border-color:var(--yellow);color:var(--yellow-ink)}
ul.act-facts small{color:inherit;opacity:.85}
details.solution{margin:10px 0;border:1px solid var(--green);background:var(--green-bg);border-radius:var(--r-m);padding:.5rem .8rem}
details.solution summary{cursor:pointer;font-weight:700;color:var(--green-ink)}
details.solution p{margin:.5rem 0;max-width:var(--measure)}
.sol-lock{font-style:italic}
/* ---------- recursos digitals enllaçats ---------- */
.links-w{margin:1rem 0}
.links-h{font-family:var(--f-head);font-weight:700;font-size:1.15rem;margin:0 0 .4rem}
ul.links{list-style:none;padding:0;margin:0}
ul.links li{margin:0;min-width:0}
ul.links a{display:flex;gap:10px;align-items:flex-start;height:100%;background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:var(--r-m);padding:.6rem .7rem;text-decoration:none;color:var(--ink)}
ul.links a:hover{border-color:var(--blue);background:var(--blue-bg)}
.lk-i{flex:none;width:30px;height:30px;color:var(--blue)}
.lk-i svg{width:100%;height:100%}
.lk-t{display:grid;gap:2px;min-width:0}
.lk-t span{font-size:.92rem;color:var(--ink-2)}
.lk-t small{color:var(--blue);font-weight:700;overflow-wrap:anywhere}
.anim .links:not(.in) li{opacity:0}
.anim .links.in li{animation:rise .45s ease-out both;animation-delay:calc(var(--d,0) * 70ms)}
@media print{.anim .links li{opacity:1!important;animation:none!important}}
/* ---------- identificació plegada i informe de sessió ---------- */
details.id-mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:.5rem .9rem;margin-bottom:14px}
details.id-mini summary{cursor:pointer}
details.id-mini .panel{border:0;padding:8px 0 0;margin:0;box-shadow:none;background:none}
.btn.rep-s{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}

/* ---------- partes de la sesión (gestión del aula) ---------- */
.spart{display:grid;gap:8px;margin:22px 0 14px;padding:14px 18px;border-radius:var(--r-m);background:var(--ink);color:#fff;scroll-margin-top:12px}
.spart:first-child{margin-top:0}
.pt-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.pt-n{font-family:var(--f-head);font-weight:700;font-size:1rem;background:var(--yellow);color:var(--yellow-ink);padding:.05rem .55rem;border-radius:var(--r-s)}
.spart h3{font-size:1.5rem;flex:1 1 240px;color:inherit}
.pt-t{font-weight:700}
.pt-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pt-clock{font-family:var(--f-head);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:5.2ch}
.spart .btn.ghost{background:transparent;color:inherit;border-color:currentColor;padding:.25rem .7rem}
.spart.over .pt-clock{color:var(--yellow)}
.pt-d summary{cursor:pointer;font-size:.92rem}
.pt-plan{margin:.4rem 0 0;padding-left:1.2rem;font-size:.92rem;display:grid;gap:2px}
.pt-plan li b{margin-left:.5rem;white-space:nowrap}
.stime{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-body);font-size:.8rem;font-weight:700;color:var(--muted);margin-left:auto}
.stime svg{width:15px;height:15px}
.toc li.toc-part a{margin-top:8px;color:var(--ink);background:var(--paper)}
/* ---------- vídeo insertado y actividades externas ---------- */
.v-moment{margin:.35rem 0;font-size:.92rem;background:var(--yellow-bg);color:var(--yellow-ink);border-radius:var(--r-s);padding:.2rem .55rem;display:inline-block}
.v-stage{margin:.5rem 0}
.v-load{display:inline-flex;align-items:center;gap:6px}
.v-load svg{width:18px;height:18px}
.embed{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r-m);overflow:hidden;background:#000;border:1px solid var(--line)}
.embed.r43{aspect-ratio:4/3}.embed.r11{aspect-ratio:1/1}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embed-w{margin:12px 0}
.embed-l{margin:.4rem 0 0;font-weight:700}
.embed-pending{margin:0;padding:18px;border:2px dashed var(--line);border-radius:var(--r-m);background:var(--paper);color:var(--ink-2)}
.mission{display:grid;gap:4px;margin:4px 0 12px}
.mission h5{font-family:var(--f-head);font-size:1.15rem;margin:.6rem 0 .1rem}
.ra-c{border:1px solid var(--line);border-radius:var(--r-m);padding:10px 14px;background:var(--paper)}
.ra-t{margin:0 0 .3rem}
.ra-c ul{margin:0;padding-left:1.1rem;display:grid;gap:3px;font-size:.95rem}
.a-code{display:inline-block;font-family:var(--f-body);font-size:.8rem;font-weight:700;background:var(--ink);color:#fff;border-radius:var(--r-s);padding:.1rem .45rem;margin-right:.5rem;vertical-align:middle}
/* ---------- avatar ---------- */
.brand-mark.av{border-radius:50%;overflow:hidden;background:var(--yellow)}
.brand-mark.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.box-av.img{width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--yellow-bg);border:2px solid var(--ink)}
.box-av.img img{width:100%;height:100%;object-fit:cover}
.cv-avatar{position:relative;width:150px;margin:-6px 0 -22px;display:grid;justify-items:center;line-height:1.25}
.cv-avatar img{width:118px;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.cv-bub{position:relative;background:#fff;color:var(--ink);font-size:.82rem;font-weight:700;padding:.45rem .6rem;border-radius:12px;margin-bottom:6px;max-width:150px;text-align:center}
.cv-bub::after{content:"";position:absolute;left:50%;bottom:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff;transform:translateX(-50%)}
.av-say{display:flex;align-items:center;gap:8px;width:100%}
.av-say img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--yellow-bg);border:2px solid var(--ink);flex:none}
.av-say p{margin:0;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.3rem .7rem}
.av-say.ok p{background:var(--green-bg);border-color:var(--green);color:var(--green-ink)}
.av-say.ko p{background:var(--yellow-bg);border-color:var(--yellow);color:var(--yellow-ink)}
.profile{display:grid;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.pf-head{display:flex;gap:10px;align-items:center}
.pf-av{flex:none;width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--yellow);border:2px solid var(--ink)}
.pf-av img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.pf-head strong{font-family:var(--f-head);font-size:1.15rem}
.pf-msg{margin:0;font-size:.84rem;color:var(--ink-2);line-height:1.35}
.pf-total{display:flex;justify-content:space-between;font-weight:700;font-size:.88rem}
.pf-bar{display:block;height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.pf-bar.big{height:12px;border:1.5px solid var(--ink)}
.pf-bar i{display:block;height:100%;background:var(--blue)}
.pf-bar.big i{background:var(--yellow)}
.pf-h{margin:4px 0 0;font-family:var(--f-head);font-weight:700}
.pf-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.toc .pf-list a{display:grid;padding:6px 8px;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-m);text-decoration:none;color:var(--ink)}
.pf-list li.cur a{border-color:var(--ink);background:var(--yellow-bg)}
.pf-list li.cur .pf-n{color:var(--ink)}
.pf-n{font-size:.75rem;font-weight:700;color:var(--muted)}
.pf-t{grid-column:1/-1;font-size:.84rem;line-height:1.3}
.pf-list .pf-bar{grid-column:1}
.pf-list small{grid-row:1;grid-column:2;font-weight:700}
.side-card{display:none}
.route .rtitle{font-size:.86rem;font-weight:700;line-height:1.25;white-space:normal}
/* ---------- correo ---------- */
.mailbox{display:grid;gap:12px}
.mail-opt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mail-opt.main{display:grid;gap:4px;justify-items:start;padding:12px 14px;border:2px solid var(--green);border-radius:var(--r-m);background:var(--green-bg)}
.mail-log{margin:0;padding-left:1.1rem;font-size:.88rem}
@media print{.spart .pt-tools,.v-stage,.embed-w,.profile,.av-say{display:none!important}}

/* ---------- tema «retro» (meta.theme = "retro"): app educativa con contornos negros, sombra sólida y acentos pastel ---------- */
:root[data-theme="retro"]{
  --ink:#1f1d1b; --ink-2:#3b3732; --muted:#5f584f; --paper:#f4ede1; --surface:#fffbf4; --line:#1f1d1b; --line-2:#e3d8c6;
  --blue:#4352c9; --blue-bg:#e3e6ff; --blue-ink:#27318a;
  --yellow:#f6c343; --yellow-bg:#fdf0c8; --yellow-ink:#463300;
  --green:#246a40; --green-bg:#dcf1e3; --green-ink:#174d2d;
  --lilac:#a9b3ff; --pink:#f5b8cb; --mint:#a7dcc0;
  --r-s:10px; --r-m:16px; --hard:3px 3px 0 var(--ink);
  --f-head:"Zilla Slab", "Rockwell", "Roboto Slab", Georgia, serif;
}
:root[data-theme="retro"] body{background:var(--paper)}
:root[data-theme="retro"] h1,:root[data-theme="retro"] h2,:root[data-theme="retro"] h3,:root[data-theme="retro"] h4{letter-spacing:0}
:root[data-theme="retro"] .top{background:var(--surface);color:var(--ink);border-bottom:2px solid var(--ink)}
:root[data-theme="retro"] .brand h1{font-size:1.55rem}
:root[data-theme="retro"] .brand p,:root[data-theme="retro"] .daybar{color:var(--ink-2)}
:root[data-theme="retro"] .daybar strong,:root[data-theme="retro"] .student-chip{color:var(--ink)}
:root[data-theme="retro"] .student-chip.empty{color:#9a4b00}
:root[data-theme="retro"] .brand-mark{width:52px;height:52px;border:2px solid var(--ink)}
:root[data-theme="retro"] .seg{border:2px solid var(--ink);border-radius:999px}
:root[data-theme="retro"] .seg button{color:var(--ink)}
:root[data-theme="retro"] .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
:root[data-theme="retro"] .tbtn{border:2px solid var(--ink);color:var(--ink);border-radius:999px;background:var(--surface)}
:root[data-theme="retro"] .tbtn.on{background:var(--yellow);color:var(--ink);border-color:var(--ink);box-shadow:var(--hard)}
:root[data-theme="retro"] .route{gap:8px;padding-bottom:12px}
:root[data-theme="retro"] .route button{color:var(--ink);border:2px solid var(--ink);border-radius:var(--r-m);background:var(--surface)}
:root[data-theme="retro"] .route button:hover{background:var(--yellow-bg)}
:root[data-theme="retro"] .route button[aria-selected="true"]{background:var(--lilac);color:var(--ink);border-color:var(--ink);box-shadow:var(--hard)}
:root[data-theme="retro"] .cover{background:var(--lilac);color:var(--ink);border:2px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
:root[data-theme="retro"] .cover::before{content:"";position:absolute;right:-60px;top:-70px;width:260px;height:260px;border-radius:50%;background:var(--yellow);opacity:.9}
:root[data-theme="retro"] .cover > *{position:relative}
:root[data-theme="retro"] .cover::after{display:none}
:root[data-theme="retro"] .cover h2,:root[data-theme="retro"] .cv-signs li{color:var(--ink)}
:root[data-theme="retro"] .cv-code{color:var(--ink)}
:root[data-theme="retro"] .cv-sub,:root[data-theme="retro"] .cv-lead{color:var(--ink-2)}
:root[data-theme="retro"] .cv-bub{border:2px solid var(--ink)}
:root[data-theme="retro"] .sec,:root[data-theme="retro"] .panel,:root[data-theme="retro"] .toc,:root[data-theme="retro"] details.id-mini,:root[data-theme="retro"] .act{border:2px solid var(--ink);border-radius:var(--r-m);box-shadow:var(--hard);background:var(--surface)}
:root[data-theme="retro"] .sec.k-activity,:root[data-theme="retro"] .sec.k-selfcheck,:root[data-theme="retro"] .sec.k-example,:root[data-theme="retro"] .sec.k-objectives,:root[data-theme="retro"] .sec.k-summary{border-left-width:2px}
:root[data-theme="retro"] .sec.k-summary{background:var(--yellow-bg)}
:root[data-theme="retro"] .act.is-mission{border-width:3px;box-shadow:5px 5px 0 var(--ink)}
:root[data-theme="retro"] .act.is-mission > .act-h{background:var(--yellow)}
:root[data-theme="retro"] .act-h{border-bottom:2px solid var(--ink)}
:root[data-theme="retro"] .act-f{border-top:2px solid var(--ink);background:var(--paper)}
:root[data-theme="retro"] .kindtag,:root[data-theme="retro"] .badge,:root[data-theme="retro"] .meta{border-radius:999px;border:1.5px solid var(--ink)}
:root[data-theme="retro"] .badge.b-auto{background:var(--mint);color:var(--ink)}
:root[data-theme="retro"] .badge.b-teacher{background:var(--pink);color:var(--ink)}
:root[data-theme="retro"] .btn{border:2px solid var(--ink);background:var(--yellow);color:var(--ink);border-radius:999px;box-shadow:2px 2px 0 var(--ink)}
:root[data-theme="retro"] .btn:hover{background:#ffd76a}
:root[data-theme="retro"] .btn:active{transform:translate(2px,2px);box-shadow:none}
:root[data-theme="retro"] .btn.ghost{background:var(--surface)}
:root[data-theme="retro"] .btn.ghost:hover{background:var(--yellow-bg)}
:root[data-theme="retro"] .btn.mail,:root[data-theme="retro"] .btn.rep-s{background:var(--lilac)}
:root[data-theme="retro"] .spart{background:var(--surface);color:var(--ink);border:2px solid var(--ink);box-shadow:var(--hard)}
:root[data-theme="retro"] .spart.over .pt-clock{color:#b42318}
:root[data-theme="retro"] .pt-n{border:1.5px solid var(--ink)}
:root[data-theme="retro"] .spart .btn.ghost{background:var(--surface);border-color:var(--ink)}
:root[data-theme="retro"] .video{border:2px dashed var(--ink);background:var(--blue-bg)}
:root[data-theme="retro"] .video .vi{background:var(--ink);border-radius:50%}
:root[data-theme="retro"] .viz,:root[data-theme="retro"] .ra-c,:root[data-theme="retro"] .box{border:1.5px solid var(--ink);background:#fff}
:root[data-theme="retro"] .embed{border:2px solid var(--ink);box-shadow:var(--hard)}
:root[data-theme="retro"] ul.links a{border:1.5px solid var(--ink);border-left:6px solid var(--blue);box-shadow:2px 2px 0 var(--ink)}
:root[data-theme="retro"] .sheet{border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);background:var(--surface)}
:root[data-theme="retro"] .profile{border-bottom:2px solid var(--ink)}
:root[data-theme="retro"] .toc .pf-list a{border:1.5px solid var(--ink);background:#fff}
:root[data-theme="retro"] .pf-list li.cur a{background:var(--lilac);box-shadow:2px 2px 0 var(--ink)}
:root[data-theme="retro"] .pf-bar{border:1px solid var(--ink);background:#fff}
:root[data-theme="retro"] .pf-bar i{background:var(--blue)}
:root[data-theme="retro"] .pf-bar.big i{background:var(--yellow)}
:root[data-theme="retro"] .toc li.toc-part a{background:var(--yellow-bg);border:1.5px solid var(--ink);border-radius:10px}
:root[data-theme="retro"] .tband{background:var(--pink);color:var(--ink);border-bottom:2px solid var(--ink)}
/* Escritorio ancho: barra lateral de navegación a la izquierda y panel del alumno a la derecha (como una app). */
@media (min-width:1180px){
  :root[data-theme="retro"] .top{position:fixed;left:0;top:0;bottom:0;width:264px;overflow:auto;border-bottom:0;border-right:2px solid var(--ink);z-index:20}
  :root[data-theme="retro"] .tband{margin-left:264px}
  :root[data-theme="retro"] .top-in{padding:18px 16px;gap:14px;min-height:100%;grid-template-rows:auto auto auto 1fr}
  :root[data-theme="retro"] .top-row{display:grid;gap:14px;align-items:start}
  :root[data-theme="retro"] .brand{align-items:flex-start}
  :root[data-theme="retro"] .tools{gap:6px}
  :root[data-theme="retro"] .daybar{display:grid;gap:4px;font-size:.84rem}
  :root[data-theme="retro"] .route{flex-direction:column;overflow:visible;margin:0;padding:0}
  :root[data-theme="retro"] .route button{min-width:0;flex:none;width:100%}
  :root[data-theme="retro"] .side-card{display:grid;gap:8px;align-self:end;justify-items:center;text-align:center;padding:12px;border:2px solid var(--ink);border-radius:var(--r-m);background:var(--yellow-bg);box-shadow:var(--hard);font-size:.88rem}
  :root[data-theme="retro"] .side-card img{width:96px;height:auto;margin-top:-4px}
  :root[data-theme="retro"] .side-card p{margin:0;font-weight:700}
  :root[data-theme="retro"] .wrap,:root[data-theme="retro"] .foot{margin-left:264px;max-width:none;padding-left:28px;padding-right:28px}
  :root[data-theme="retro"] .grid{grid-template-columns:minmax(0,1fr) 300px}
  :root[data-theme="retro"] .grid > .toc{order:2}
}
/* ds-allow-hardcode:end */

</style>

mnat, identificant-ne les característiques personals, formatives, d'experiència i d'habilitats per alinear-les amb les demandes del mercat laboral. Això serveix per personalitzar l'orientació, maximitzar l'ocupabilitat i dissenyar itineraris formatius i professionals adequats que redueixin qualsevol desajust amb l'ocupació."]},{"t":"p","x":["La unidad dispone de 15 horas lectivas, que representan el 35 % del peso ponderado de la unidad en el módulo profesional M1707 (60 horas), regulado por el Real Decreto 86/2026, de 11 de febrero, e integrado en el Certificado Profesional de Habilitación para la docencia en grados A, B y C (código SSC_C017_5B).","La unitat disposa de 15 hores lectives, que representen el 35 % del pes ponderat de la unitat en el mòdul professional M1707 (60 hores), regulat pel Real Decreto 86/2026, d'11 de febrer, i integrat en el Certificat Professional d'Habilitació per a la docència en graus A, B i C (codi SSC_C017_5B)."]},{"t":"h3","x":["Resultados de aprendizaje de la unidad","Resultats d'aprenentatge de la unitat"]},{"t":"defs","items":[[["RA1","RA1"],["Selecciona cauces informativos y estrategias de búsqueda y actualización de la información del entorno profesional y productivo, reflejándolos en la programación de orientación profesional de los grados A, B y C.","Selecciona canals informatius i estratègies de cerca i actualització de la informació de l'entorn professional i productiu, i els reflecteix en la programació d'orientació professional dels graus A, B i C."]],[["RA2","RA2"],["Determina técnicas específicas en el proceso de información y orientación profesional al alumnado, empresas, organismos e instituciones de manera diferenciada, favoreciendo y facilitando su participación activa.","Determina tècniques específiques en el procés d'informació i orientació professional a l'alumnat, empreses, organismes i institucions de manera diferenciada, afavorint i facilitant-ne la participació activa."]],[["RA3","RA3"],["Asesora al alumnado destinatario de la acción formativa sobre itinerarios formativos, formación profesional y oportunidades de empleo, permitiéndoles la cualificación y recualificación de manera personalizada.","Assessora l'alumnat destinatari de l'acció formativa sobre itineraris formatius, formació professional i oportunitats d'ocupació, i li permet la qualificació i la requalificació de manera personalitzada."]]]},{"t":"h3","x":["Bloques de contenidos","Blocs de continguts"]},{"t":"table","rows":[[["Bloque temático","Bloc temàtic"],["Contenidos principales","Continguts principals"],["RA","RA"],["Duración estimada","Durada estimada"],["Sesión","Sessió"]],[["1.1. El perfil profesional","1.1. El perfil professional"],["Características individuales, variables personales, formación, experiencia laboral vs. profesional, habilidades y actitudes.","Característiques individuals, variables personals, formació, experiència laboral vs. professional, habilitats i actituds."],["RA2 (CEa, CEb), RA1 (CEc)","RA2 (CEa, CEb), RA1 (CEc)"],["5,25 horas","5,25 hores"],["1","1"]],[["1.2. El conocimiento del mercado laboral","1.2. El coneixement del mercat laboral"],["Tendencias 2026, tejido productivo, emergencia de la IA y transición verde, Red EURES, modalidades de empleo y teletrabajo.","Tendències 2026, teixit productiu, emergència de la IA i transició verda, Red EURES, modalitats d'ocupació i teletreball."],["RA1 (CEa), RA3 (CEa, CEb)","RA1 (CEa), RA3 (CEa, CEb)"],["3,25 horas","3,25 hores"],["2","2"]],[["1.3. Itinerarios formativos y profesionales","1.3. Itineraris formatius i professionals"],["Concepto de itinerario, análisis DAFO, objetivos SMART, plan de acción, marca personal, cualificación y FP (grados A, B, C).","Concepte d'itinerari, anàlisi DAFO, objectius SMART, pla d'acció, marca personal, qualificació i FP (graus A, B, C)."],["RA3 (CEc–CEi), RA2 (CEe–CEh)","RA3 (CEc–CEi), RA2 (CEe–CEh)"],["6,50 horas","6,50 hores"],["3","3"]]]},{"t":"p","x":["Organización en el aula: 3 sesiones de 5,5 horas, cada una en dos partes (3 h + 2,5 h). Cada sesión tiene una actividad evaluable con su herramienta digital y actividades autocorregibles de repaso.","Organització a l'aula: 3 sessions de 5,5 hores, cadascuna en dues parts (3 h + 2,5 h). Cada sessió té una activitat avaluable amb la seva eina digital i activitats autocorregibles de repàs."]}],"acts":[],"videos":[],"part":1,"time":["15 min","15 min"]},{"num":2,"kind":"theory","title":["1.1.1. Características individuales del proceso de orientación","1.1.1. Característiques individuals del procés d'orientació"],"nodes":[{"t":"p","x":["El perfil profesional constituye la representación integral de las características, conocimientos, experiencias, habilidades y actitudes que definen a una persona en su ámbito laboral. Su análisis riguroso permite alinear las capacidades individuales con las exigencias reales del tejido productivo, minimizando los desajustes entre la oferta y la demanda de trabajo.","El perfil professional constitueix la representació integral de les característiques, coneixements, experiències, habilitats i actituds que defineixen una persona en el seu àmbit laboral. El seu anàlisi rigorós permet alinear les capacitats individuals amb les exigències reals del teixit productiu, minimitzant els desajustos entre l'oferta i la demanda de treball."]},{"t":"p","x":["Tal como se establece en la metodología de servicios de orientación laboral del SERVEF y los estándares públicos de empleo, la atención individualizada se desarrolla mediante un itinerario de entrevistas individuales (con una previsión de hasta un máximo de 10 sesiones de 60 minutos de duración aproximada), que finaliza cuando el usuario o usuaria ha adquirido la autonomía necesaria para gestionar su propio proceso de inserción.","Tal com s'estableix en la metodologia de serveis d'orientació laboral del SERVEF i els estàndards públics d'ocupació, l'atenció individualitzada es desenvolupa mitjançant un itinerari d'entrevistes individuals (amb una previsió de fins a un màxim de 10 sessions de 60 minuts de durada aproximada), que finalitza quan l'usuari o usuària ha adquirit l'autonomia necessària per gestionar el seu propi procés d'inserció."]},{"t":"viz","v":{"type":"key","i":"calendar","s":"info","big":["10 × 60 min","10 × 60 min"],"x":["Máximo de entrevistas individuales de la atención individualizada, hasta que la persona puede autogestionar su itinerario.","Màxim d'entrevistes individuals de l'atenció individualitzada, fins que la persona pot autogestionar el seu itinerari."]}},{"t":"p","x":["El profesional de la orientación debe explorar de manera sistemática cuatro áreas de trabajo clave:","El professional de l'orientació ha d'explorar de manera sistemàtica quatre àrees de treball clau:"]},{"t":"viz","v":{"type":"cards","num":true,"items":[{"i":"target","s":"info","x":["Planificación","Planificació"],"d":["Evaluar si la persona tiene objetivos profesionales claros y si establece metas intermedias estructuradas.","Avaluar si la persona té objectius professionals clars i si estableix fites intermèdies estructurades."]},{"i":"heart","s":"info","x":["Motivación","Motivació"],"d":["Explorar las creencias, expectativas, autoeficacia, estado de ánimo y actitud ante el empleo.","Explorar les creences, expectatives, autoeficàcia, estat d'ànim i actitud davant de l'ocupació."]},{"i":"search","s":"info","x":["Información","Informació"],"d":["Identificar el grado de conocimiento sobre canales de acceso, mercado laboral, cursos de cualificación y recursos del sector.","Identificar el grau de coneixement sobre canals d'accés, mercat laboral, cursos de qualificació i recursos del sector."]},{"i":"wrench","s":"info","x":["Habilidades","Habilitats"],"d":["Analizar las acciones prácticas realizadas para buscar trabajo y determinar su eficacia real.","Analitzar les accions pràctiques realitzades per cercar feina i determinar-ne l'eficàcia real."]}]}},{"t":"video","id":"autoconeixement","title":["L'Autoconeixement","L'Autoconeixement"],"source":["Diputació de Barcelona","Diputació de Barcelona"],"duration":"6:08","url":"https://www.youtube.com/watch?v=AdkEGhqBzZw","verified":true,"langLabel":["en catalán","en català"],"moment":["después de las cuatro áreas de trabajo, antes de la ficha «¿Qué sé de mí?».","després de les quatre àrees de treball, abans de la fitxa «Què sé de mi?»."],"use":["Presenta el autoconocimiento como base para elegir un itinerario educativo, mediante testimonios de jóvenes, familias, profesorado y profesionales de la orientación.","Presenta l'autoconeixement com a base per triar un itinerari educatiu, mitjançant testimonis de joves, famílies, professorat i professionals de l'orientació."],"question":["¿Qué aspecto del autoconocimiento del vídeo te parece más útil para orientar a tu alumnado?","Quin aspecte de l'autoconeixement del vídeo et sembla més útil per orientar el teu alumnat?"]}],"acts":["s1-quesemi","s1-areas"],"videos":[],"part":1,"time":["75 min","75 min"]},{"num":3,"kind":"theory","title":["1.1.2. Características personales","1.1.2. Característiques personals"],"nodes":[{"t":"p","x":["La evaluación de las características personales permite identificar los patrones de conducta habituales y espontáneos de la persona para compararlos con los requerimientos del puesto de trabajo.","L'avaluació de les característiques personals permet identificar els patrons de conducta habituals i espontanis de la persona per comparar-los amb els requeriments del lloc de treball."]},{"t":"p","x":["Conocer las características personales ayuda al alumnado a decidir su área de interés profesional comparándolas con las demandas del puesto de trabajo para evitar desajustes. Aparecen en situaciones similares y reflejan el modo de reaccionar habitual y espontáneo del individuo.","Conèixer les característiques personals ajuda l'alumnat a decidir la seva àrea d'interès professional comparant-les amb les demandes del lloc de treball per evitar desajustos. Apareixen en situacions semblants i reflecteixen la manera de reaccionar habitual i espontània de l'individu."]},{"t":"box","k":"important","label":["IMPORTANTE","IMPORTANT"],"nodes":[{"t":"p","x":["Marco teórico de referencia: de acuerdo con la teoría tipológica de John Holland (1966), basada en el modelo de rasgos y factores, tanto las personalidades individuales como los ambientes de trabajo se pueden clasificar en seis tipologías (Realista, Investigador, Artístico, Social, Emprendedor y Convencional: RIASEC). La satisfacción y el rendimiento laboral dependen del grado de congruencia entre los rasgos de personalidad del individuo y las exigencias del entorno profesional.","Marc teòric de referència: d'acord amb la teoria tipològica de John Holland (1966), basada en el model de trets i factors, tant les personalitats individuals com els ambients de treball es poden classificar en sis tipologies (Realista, Investigador, Artístic, Social, Emprenedor i Convencional: RIASEC). La satisfacció i el rendiment laboral depenen del grau de congruència entre els trets de personalitat de l'individu i les exigències de l'entorn professional."]},{"t":"viz","v":{"type":"cycle","title":["Los seis tipos de Holland (RIASEC)","Els sis tipus de Holland (RIASEC)"],"center":["Persona ↔ ambiente de trabajo","Persona ↔ ambient de treball"],"items":[{"i":"wrench","s":"info","x":["R · Realista","R · Realista"]},{"i":"search","s":"info","x":["I · Investigador","I · Investigador"]},{"i":"paint","s":"info","x":["A · Artístico","A · Artístic"]},{"i":"group","s":"info","x":["S · Social","S · Social"]},{"i":"megaphone","s":"info","x":["E · Emprendedor","E · Emprenedor"]},{"i":"folder","s":"info","x":["C · Convencional","C · Convencional"]}],"note":["Solo los nombres de los tipos: la unidad no describe cada tipo.","Només els noms dels tipus: la unitat no descriu cada tipus."]}},{"t":"p","x":["En este subapartado se requiere una especial atención a la diversidad y la atención personalizada al alumnado con necesidades educativas o formativas especiales (NEE) y colectivos con dificultades de inserción, adaptando los instrumentos de evaluación psicopedagógica y eliminando estereotipos de género o edad.","En aquest subapartat es requereix una especial atenció a la diversitat i l'atenció personalitzada a alumnat amb necessitats educatives o formatives especials (NEE) i col·lectius amb dificultats d'inserció, adaptant els instruments d'avaluació psicopedagògica i eliminant estereotips de gènere o edat."]}]}],"acts":["s1-holland"],"videos":[],"part":1,"time":["45 min","45 min"]},{"num":4,"kind":"theory","title":["1.1.3. Formación","1.1.3. Formació"],"nodes":[{"t":"p","x":["Se define el punto de partida formativo como la base sobre la cual se planifica cualquier itinerario de cualificación o recualificación.","Es defineix el punt de partida formatiu com la base sobre la qual es planifica qualsevol itinerari de qualificació o requalificació."]},{"t":"p","x":["Es indispensable conocer el punto de partida formativo del alumno (titulaciones obtenidas, estudios previos, cursos de especialización), ya que los itinerarios formativos se planifican en función de este. Permite contrastar el perfil con el requerido para la profesión de interés y diseñar itinerarios personalizados.","És indispensable conèixer el punt de partida formatiu de l'alumne (titulacions obtingudes, estudis previs, cursos d'especialització), ja que els itineraris formatius es planifiquen en funció d'aquest. Permet contrastar el perfil amb el requerit per a la professió d'interès i dissenyar itineraris personalitzats."]},{"t":"p","x":["En el marco del nuevo Sistema de Formación Profesional establecido por el Real Decreto 86/2026 y la Ley Orgánica de Ordenación e Integración de la FP, la formación se estructura de manera flexible y acumulable en:","En el marc del nou Sistema de Formació Professional establert pel Real Decreto 86/2026 i la Ley Orgánica de Ordenación e Integración de la FP, la formació s'estructura de manera flexible i acumulable en:"]},{"t":"viz","v":{"type":"pyramid","items":[{"i":"star","x":["Grado C · Certificados profesionales","Grau C · Certificats professionals"],"d":["Titulaciones completas que acreditan unidades de competencia del Catálogo Nacional de Cualificaciones Profesionales.","Titulacions completes que acrediten unitats de competència del Catàleg Nacional de Qualificacions Professionals."]},{"i":"layers","x":["Grado B · Módulos profesionales","Grau B · Mòduls professionals"],"d":["Unidades formativas con calificación numérica de 1 a 10.","Unitats formatives amb qualificació numèrica d'1 a 10."]},{"i":"tag","x":["Grado A · Microformaciones","Grau A · Microformacions"],"d":["Acreditaciones parciales de competencia.","Acreditacions parcials de competència."]}],"axis":[["Acreditación completa","Acreditació completa"],["Acreditación parcial","Acreditació parcial"]]}}],"acts":["s1-grados"],"videos":[],"part":1,"time":["45 min","45 min"]},{"num":5,"kind":"theory","title":["1.1.4. Experiencia profesional","1.1.4. Experiència professional"],"nodes":[{"t":"p","x":["Las fuentes de documentación pedagógica del módulo M1707 establecen una distinción conceptual fundamental entre dos tipos de trayectoria:","Les fonts de documentació pedagògica del mòdul M1707 estableixen una distinció conceptual fonamental entre dos tipus de trajectòria:"]},{"t":"viz","v":{"type":"compare","vs":true,"cols":[{"i":"euro","s":"must","x":["Experiencia laboral (remunerada)","Experiència laboral (remunerada)"],"items":[["Conjunto de actividades desarrolladas bajo una relación contractual laboral o mercantil.","Conjunt d'activitats desenvolupades sota una relació contractual laboral o mercantil."],["Se describe especificando el puesto ocupado, la empresa, la duración (años y meses), las tareas realizadas, las funciones asumidas y las competencias prácticas demostradas.","Es descriu detalladament especificant el lloc ocupat, l'empresa, la durada (anys i mesos), les tasques realitzades, les funcions assumides i les competències pràctiques demostrades."]]},{"i":"handshake","s":"safe","x":["Experiencia profesional (no remunerada)","Experiència professional (no remunerada)"],"items":[["Capacitación y vivencias adquiridas en periodos de prácticas formativas, voluntariado, proyectos de cooperación, becas o colaboraciones.","Capacitació i vivències adquirides en períodes de pràctiques formatives, voluntariat, projectes de cooperació, beques o col·laboracions."],["Posee un alto valor profesionalizador y se debe integrar en el balance de competencias.","Posseeix un alt valor professionalitzador i s'ha d'integrar en el balanç de competències."]]}]}},{"t":"p","x":["Ayuda a informar de ofertas de empleo acordes al perfil y a implicar al alumno en su desarrollo.","Ajuda a informar d'ofertes d'ocupació d'acord amb el perfil i a implicar l'alumne en el seu desenvolupament."]}],"acts":["s1-exp"],"videos":[],"part":2,"time":["25 min","25 min"]},{"num":6,"kind":"theory","title":["1.1.5. Habilidades y actitudes","1.1.5. Habilitats i actituds"],"nodes":[{"t":"p","x":["Se contrasta el concepto de habilidad (saber hacer), entendida como la maestría o aptitud práctica para ejecutar procedimientos y tareas específicas, frente al conocimiento teórico (saber qué).","Es contrasta el concepte d'habilitat (saber fer), entesa com la mestria o aptitud pràctica per executar procediments i tasques específiques, davant del coneixement teòric (saber què)."]},{"t":"box","k":"idea","label":null,"nodes":[{"t":"p","x":["Idea clave: la habilidad se orienta a la práctica y a los procedimientos («saber hacer»); los conocimientos teóricos son el «saber qué».","Idea clau: l'habilitat s'orienta a la pràctica i als procediments («saber fer»); els coneixements teòrics són el «saber què»."]}]},{"t":"p","x":["Las actitudes y competencias transversales más demandadas por el tejido productivo actual incluyen:","Les actituds i competències transversals més demandades pel teixit productiu actual inclouen:"]},{"t": bloquea una etapa del proceso de cualificación, recualificación e inserción laboral.","L'alumnat dissenya el seu propi itinerari com una aventura per nivells. Cada nivell desbloqueja una etapa del procés de qualificació, requalificació i inserció laboral."]},{"t":"list","k":"ul","l":1,"items":[["Nivel 1 — Mapa DAFO: cumplimenta una matriz DAFO personal y profesional, separando fortalezas y debilidades —internas— de oportunidades y amenazas —externas—.","Nivell 1 — Mapa DAFO: emplena una matriu DAFO personal i professional, separant fortaleses i febleses —internes— d'oportunitats i amenaces —externes—."],["Nivel 2 — Objetivos SMART: formula tres objetivos profesionales a corto, medio y largo plazo, comprobando que sean específicos, medibles, alcanzables, relevantes y temporizados.","Nivell 2 — Objectius SMART: formula tres objectius professionals a curt, mitjà i llarg termini, comprovant que siguin específics, mesurables, assolibles, rellevants i temporitzats."],["Nivel 3 — Misiones de cualificación: selecciona acciones formativas pertinentes en FP de grados A, B o C, cursos, certificaciones, idiomas o prácticas.","Nivell 3 — Missions de qualificació: selecciona accions formatives pertinents en FP de graus A, B o C, cursos, certificacions, idiomes o pràctiques."],["Nivel 4 — Marca personal: crea un portfolio o micropágina que recoja su propuesta de valor, itinerario, plan de acción y estrategia de búsqueda activa de empleo.","Nivell 4 — Marca personal: crea un portfoli o micropàgina que reculli la seva proposta de valor, itinerari, pla d'acció i estratègia de cerca activa d'ocupació."]],"start":1},{"t":"p","x":["Al completar cada parada, copia el resultado en tu Notion personal (secciones: DAFO, objetivos SMART, plan de acción, formación prevista, oportunidades detectadas y marca personal). Cada parada tiene una tarea obligatoria y una «misión extra» opcional.","En completar cada parada, copia el resultat al teu Notion personal (seccions: DAFO, objectius SMART, pla d
