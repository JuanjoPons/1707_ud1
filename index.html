ament."],["Del grado de congruencia entre los rasgos de personalidad del individuo y las características del ambiente ocupacional.","Del grau de congruència entre els trets de personalitat de l'individu i les característiques de l'ambient ocupacional."],["De la edad de incorporación al primer puesto de trabajo.","De l'edat d'incorporació al primer lloc de treball."]],"ans":2,"exp":["Holland postula que la elección y la satisfacción profesional dependen del ajuste entre la tipología de personalidad y el ambiente ocupacional.","Holland postula que l'elecció i la satisfacció professional depenen de l'ajust entre la tipologia de personalitat i l'ambient ocupacional."]},{"q":["¿Cuál es la diferencia fundamental entre la experiencia laboral y la experiencia profesional según el temario del módulo M1707?","Quina és la diferència fonamental entre l'experiència laboral i l'experiència professional segons el temari del mòdul M1707?"],"opts":[["La experiencia laboral es pública y la profesional es privada.","L'experiència laboral és pública i la professional és privada."],["La experiencia laboral requiere una relación contractual remunerada, mientras que la profesional incluye prácticas, voluntariado o becas no remuneradas.","L'experiència laboral requereix una relació contractual remunerada, mentre que la professional inclou pràctiques, voluntariat o beques no remunerades."],["No hay ninguna diferencia, son términos sinónimos.","No hi ha cap diferència, són termes exactament sinònims."],["La experiencia profesional solo se adquiere en el extranjero mediante la Red EURES.","L'experiència professional només s'adquireix a l'estranger mitjançant la Red EURES."]],"ans":1,"exp":["Laboral: contratada y remunerada; profesional: prácticas, voluntariado o colaboraciones no remuneradas pero con valor capacitador.","Laboral: contractada i remunerada; professional: pràctiques, voluntariat o col·laboracions no remunerades però amb valor capacitador."]},{"q":["El concepto de habilidad en el análisis del perfil se define principalmente como:","El concepte d'habilitat en l'anàlisi del perfil es defineix principalment com:"],"opts":[["El conocimiento teórico o «saber qué».","El coneixement teòric o «saber què»."],["La capacidad económica del alumno para financiar cursos.","La capacitat econòmica de l'alumne per finançar cursos."],["La pericia o aptitud práctica orientada a los procedimientos o «saber hacer».","La perícia o aptitud pràctica orientada als procediments o «saber fer»."],["El nivel de titulación académica obtenido.","El nivell de titulació acadèmica obtingut."]],"ans":2,"exp":["La habilidad se asocia a la dimensión práctica (saber hacer), a diferencia de los conocimientos teóricos (saber qué).","L'habilitat s'associa a la dimensió pràctica (saber fer), a diferència dels coneixements teòrics (saber què)."]},{"q":["¿Qué red europea fue creada en 1993 por la Comisión Europea para facilitar la libre circulación de trabajadores en el Espacio Económico Europeo?","Quina xarxa europea va ser creada el 1993 per la Comissió Europea per facilitar la lliure circulació de treballadors en l'Espai Econòmic Europeu?"],"opts":[["Red Erasmus+.","Red Erasmus+."],["Red EURES.","Red EURES."],["Catálogo Europass de Títulos.","Catálogo Europass de Títulos."],["Observatorio Estatal Next Generation.","Observatorio Estatal Next Generation."]],"ans":1,"exp":["La Red EURES se creó en 1993 para favorecer la información y la movilidad laboral en el EEE.","La Red EURES es va crear el 1993 per afavorir la informació i la mobilitat laboral en l'EEE."]},{"q":["Según la Ley 10/2021 de trabajo a distancia en España, ¿qué característica define específicamente el «teletrabajo»?","Segons la Ley 10/2021 de treball a distància a Espanya, quina característica defineix específicament el «teletreball»?"],"opts":[["Que se realiza siempre desde un país diferente al de la empresa.","Que es realitza sempre des d'un país diferent al de l'empresa."],["Que requiere el uso exclusivo o predominante de tecnologías de la información y herramientas telemáticas (TIC).","Que requereix l'ús exclusiu o predominant de tecnologies de la informació i eines telemàtiques (TIC)."],["Que no requiere ningún tipo de contrato ni acuerdo escrito.","Que no requereix cap tipus de contracte ni acord escrit."],["Que es una modalidad exclusiva para trabajadores autónomos del RETA.","Que és una modalitat exclusiva per a treballadors autònoms del RETA."]],"ans":1,"exp":["El teletrabajo es la subcategoría del trabajo a distancia basada en herramientas telemáticas y TIC.","El teletreball és la subcategoria del treball a distància basada en eines telemàtiques i TIC."]},{"q":["En el diseño de un itinerario profesional, un objetivo configurado según el criterio SMART debe ser:","En el disseny d'un itinerari professional, un objectiu configurat sota el criteri SMART ha de ser:"],"opts":[["Simple, moderado, anónimo, rápido y teórico.","Simple, moderat, anònim, ràpid i teòric."],["Específico, medible, alcanzable, relevante y temporizado.","Específic, mesurable, assolible, rellevant i temporitzat."],["Sistemático, global, automático, regional y transversal.","Sistemàtic, global, automàtic, regional i transversal."],["Subjetivo, motivador, amplio, real y técnico.","Subjectiu, motivador, ampli, real i tècnic."]],"ans":1,"exp":["SMART: específicos, medibles, alcanzables, relevantes y temporizados.","SMART: específics, mesurables, assolibles, rellevants i temporitzats."]},{"q":["De acuerdo con el nuevo marco del Sistema de FP (RD 86/2026), un grado C corresponde a:","D'acord amb el nou marc del Sistema de FP (RD 86/2026), un grau C correspon a:"],"opts":[["Una microformación o acreditación parcial de competencia.","Una microformació o acreditació parcial de competència."],["Un módulo profesional individualizado.","Un mòdul professional individualitzat."],["Un certificado profesional completo que acredita unidades de competencia.","Un certificat professional complet que acredita unitats de com     if (M.mailEndpoint) {
      var bd = h("button", { type: "button", class: "btn big", onclick: function () {
        // Formulario en una pestaña nueva: viaja con la sesión de Google del alumnado (scripts limitados al dominio
        // del centro) y la pestaña muestra la respuesta real del script (enviado o inicio de sesión).
        var d = mailData();
        var f = h("form", { method: "POST", action: M.mailEndpoint, target: "_blank", style: "display:none" },
          h("input", { type: "hidden", name: "payload" }));
        f.firstChild.value = JSON.stringify({ key: M.mailKey || "", course: M.short || "", subject: d.subj, name: S.student.name.trim(), group: S.student.group.trim(), scope: repLabel(), lang: S.lang, text: d.txt });
        document.body.appendChild(f); f.submit(); f.remove();
        logMail("directo"); toast(t("mailOpened"));
      } }, t("mailDirect"));
      box.appendChild(h("div", { class: "mail-opt main" }, bd, h("p", { class: "hint" }, t("mailDirectHint"))));
    }
    function compose(kind) {
      var d = mailData(), enc = encodeURIComponent, lim = kind === "gmail" ? 6500 : 1800;
      var body = enc(d.txt).length < lim ? d.txt : t("mailPaste") + "\n\n" + S.student.name + " (" + S.student.group + ") · " + repLabel();
      quietCopy(d.txt).then(function () { toast(t("mailCopied")); });
      logMail(kind);
      var url = kind === "gmail" ? "https://mail.google.com/mail/?view=cm&fs=1&to=" + enc(M.mailTo || "") + "&su=" + enc(d.subj) + "&body=" + enc(body)
        : "mailto:" + (M.mailTo || "") + "?subject=" + enc(d.subj) + "&body=" + enc(body);
      if (kind === "gmail") window.open(url, "_blank", "noopener"); else window.location.href = url;
    }
    if (M.mailTo) box.appendChild(h("div", { class: "mail-opt" },
      h("button", { type: "button", class: M.mailEndpoint ? "btn ghost" : "btn", onclick: function () { compose("gmail"); } }, t("mailGmail")),
      h("button", { type: "button", class: "btn ghost", onclick: function () { compose("app"); } }, t("mailApp"))));
    box.appendChild(h("p", { class: "hint" }, t("mailHint")));
    if (S.mails && S.mails.length) box.appendChild(h("div", null, h("p", null, h("b", null, t("mailLog"))),
      h("ul", { class: "mail-log" }, S.mails.slice(-6).reverse().map(function (m) { return h("li", null, new Date(m.at).toLocaleString(S.lang === "es" ? "es-ES" : "ca-ES") + " · " + m.scope + " · " + m.how); }))));
    return overlayShell("mail", t("mailTitle"), box);
  }
  function validReport() {
    if (!S.student.name.trim() || !S.student.group.trim()) {
      toast(t("needId")); window.scrollTo(0, 0);
      var el = document.getElementById(!S.student.name.trim() ? "st-name" : "st-group");
      if (el) { var dd = el.closest("details"); if (dd) dd.open = true; el.focus(); }
      return false;
    }
    if (collect().doneN === 0 && !window.confirm(t("emptyWarn"))) return false;
    return true;
  }
  function generateReport(scope) {
    REP = scope && scope.k ? scope : null;
    if (validReport()) openOv("report");
  }
  function printReport() {
    var fo = document.getElementById("finalobs"), pv = document.getElementById("finalobs-print");
    if (fo && pv) { pv.textContent = fo.value || "—"; pv.style.display = ""; fo.parentNode.querySelector("textarea").style.display = "none"; }
    document.body.classList.add("print-report");
    var old = document.title; document.title = "Informe_" + (M.short || "Web") + "_" + (REP ? REP.id : t("day") + C.day) + "_" + slug(S.student.name);
    window.print();
    setTimeout(function () {
      document.title = old; document.body.classList.remove("print-report");
      if (fo && pv) { pv.style.display = "none"; fo.style.display = ""; }
    }, 600);
  }
  function copyReport() {
    var txt = reportPlain(collect());
    var fb = document.getElementById("copyfallback");
    function fallback() { fb.style.display = "block"; fb.value = txt; fb.focus(); fb.select(); toast(t("copyFail")); }
    if (navigator.clipboard && window.isSecureContext !== false) {
      navigator.clipboard.writeText(txt).then(function () { toast(t("copied")); }, function () {
        fb.value = txt; fb.style.display = "block"; fb.select();
        try { if (document.execCommand("copy")) { toast(t("copied")); return; } } catch (e) { }
        fallback();
      });
    } else {
      fb.value = txt; fb.style.display = "block"; fb.select();
      try { if (document.execCommand("copy")) { toast(t("copied")); return; } } catch (e) { }
      fallback();
    }
  }
  window.addEventListener("afterprint", function () { document.body.classList.remove("print-report"); });

  // API mínima per a proves automàtiques
  window.PRL = { state: function () { return S; }, report: function () { return reportPlain(collect()); }, go: go, setLang: setLang };
  render();
})();

</script>
</body>
</html>
